name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  TRIPLET: x64-windows-static

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare vcpkg binary cache
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=$TRIPLET

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cmake --install build --config Release --prefix dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphixxx-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Graphixxx-windows-x64
          path: Graphixxx-windows-x64

      - name: Zip
        run: cd Graphixxx-windows-x64 && zip -r ../Graphixxx-windows-x64.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: Graphixxx-windows-x64.zip
